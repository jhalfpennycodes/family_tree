# Nginx configuration for Family Tree Application (Docker-ready)

# Define upstream server for Flask backend
upstream flask_backend {
    server flask:8000;  # Flask service in Docker Compose
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name free-family-tree.co.uk www.free-family-tree.co.uk;

    return 301 https://$host$request_uri;
}

# Secure HTTPS server
server {
    listen 443 ssl;
    server_name free-family-tree.co.uk www.free-family-tree.co.uk;

    # SSL certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/free-family-tree.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/free-family-tree.co.uk/privkey.pem;

    # Keep your same settings from before
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/family_tree_access.log;
    error_log /var/log/nginx/family_tree_error.log;

    # === Your proxy + static config stays exactly the same ===
    location /familyTree/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/uploads/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

server {
    listen 80;
    server_name localhost;

    # Increase client body size for file uploads
    client_max_body_size 10M;

    # Root directory for React frontend build
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/family_tree_access.log;
    error_log /var/log/nginx/family_tree_error.log;

    # API requests - proxy to Flask backend
    location /familyTree/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static file uploads (avatars) - proxy to Flask
    location /static/uploads/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve React static assets (JS, CSS, images)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle React Router - serve index.html for all unmatched routes
    location / {
        try_files $uri /index.html;
    }

    # Specific handling for index.html (no caching)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve favicon or other root-level static files
    location = /vite.svg {
        root /usr/share/nginx/html;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}